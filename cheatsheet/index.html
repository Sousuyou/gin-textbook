<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- セキュリティ: 読み込み元を自サイトに限定（万一の不正スクリプト実行を阻止） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta name="theme-color" content="#15120f" />
    <title>Bar Soutsu 早見表</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/icon.svg" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="https://sousuyou.github.io/top/theme.css" />
    <!-- 早見表の頭出しナビ（このページ専用のスタイル。共有styles.cssは触らない） -->
    <style>
      html { scroll-behavior: smooth; }
      .cheat-index {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 22px;
        padding: 12px;
        background: var(--panel-soft, #f3f2ee);
        border: 1px solid var(--line, #c9c8c2);
      }
      .cheat-index-label {
        width: 100%;
        margin: 0 0 4px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted, #6f6d67);
      }
      .cheat-index a {
        display: inline-block;
        padding: 6px 10px;
        font-size: 13px;
        line-height: 1.2;
        text-decoration: none;
        color: var(--text, #161616);
        background: var(--panel, #fbfaf6);
        border: 1px solid var(--line-strong, #242424);
      }
      .cheat-index a:hover,
      .cheat-index a:focus {
        background: var(--accent, #161616);
        color: var(--on-accent, #fff);
      }
      /* 共通ナビに見出しが隠れないよう、ジャンプ先に余白を確保 */
      .cheat-card { scroll-margin-top: 72px; }
    </style>
  </head>
  <body class="has-nav">
    <!-- 共通ナビ：中身は nav.js が自動生成（JS無効時はTOPリンクだけ残る） -->
    <nav class="site-nav" id="site-nav">
      <a class="site-nav-link" href="https://sousuyou.github.io/top/">TOP</a>
    </nav>
    <script src="https://sousuyou.github.io/top/nav.js?v=20260622" defer></script>
    <main class="app-shell">
      <header class="hero">
        <div class="hero-main">
          <p class="brand-mark">Bar Soutsu</p>
          <p class="eyebrow">Bar Quick Reference / Service</p>
          <h1 id="page-title">早見表</h1>
          <p class="lead">
            接客中・仕込み中にさっと確認するための早見表。数字は店の基本の型なので、レシピに合わせて調整すること。
            レシピの詳しい手順は<a href="https://sousuyou.github.io/cocktail-recipe-book/">レシピ帳</a>へ。
          </p>
        </div>
      </header>

      <!-- 頭出しナビ：中身は app.js が表データから自動生成 -->
      <nav class="cheat-index" id="cheat-index" aria-label="早見表の目次"></nav>

      <section class="view is-active" aria-label="早見表">
        <div id="cheatsheet-body" class="cheatsheet-body"></div>
      </section>

      <footer class="app-footer">
        <span>Bar Soutsu 早見表</span>
        <span>社内教育用 / 数値は店の基準に合わせて調整</span>
      </footer>
    </main>

    <script src="../cheatsheet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
