<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- セキュリティ: 読み込み元を自サイトに限定（万一の不正スクリプト実行を阻止） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <title>Bar Soutsu ジン教本</title>

    <!-- SNS・チャットでURLを共有したときの見栄え（OGP / Twitter Card） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bar Soutsu" />
    <meta property="og:title" content="ジン教本｜Bar Soutsu" />
    <meta property="og:description" content="スタッフ教育用のジン教本。基礎知識・用語集・クイズ・早見表で体系的に学べます。" />
    <meta property="og:url" content="https://sousuyou.github.io/gin-textbook/" />
    <meta property="og:image" content="https://sousuyou.github.io/gin-textbook/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sousuyou.github.io/gin-textbook/assets/og-image.png" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://sousuyou.github.io/top/theme.css" />
  </head>
  <body class="has-nav">
    <!-- 共通ナビ：中身は nav.js が自動生成（JS無効時はTOPリンクだけ残る） -->
    <nav class="site-nav" id="site-nav">
      <a class="site-nav-link" href="https://sousuyou.github.io/top/">TOP</a>
    </nav>
    <script src="https://sousuyou.github.io/top/nav.js" defer></script>
    <main class="app-shell">
      <!-- ===== ヘッダー ===== -->
      <header class="hero">
        <div class="hero-main">
          <p class="brand-mark">Bar Soutsu</p>
          <p class="eyebrow">Gin Textbook / Staff Training</p>
          <h1 id="page-title">ジン教本</h1>
          <p class="lead">
            ジンを「定義・歴史・製法・銘柄・接客」まで体系で学ぶ、Bar Soutsu スタッフ向けの教本。
            読み物として読み込み、わからない用語は用語集タブで引く。
            実力チェックは<a href="quiz/">クイズ道場</a>、現場での確認は<a href="cheatsheet/">早見表</a>へ。
          </p>
        </div>
      </header>

      <!-- ===== 学習進捗バー（常時表示） ===== -->
      <div id="progress-band" class="progress-band">
        <p id="progress-label" class="progress-label"></p>
        <div class="progress-track" role="progressbar" aria-label="学習進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
          <span id="progress-fill" class="progress-fill"></span>
        </div>
      </div>

      <!-- ===== ビュー切替タブ ===== -->
      <nav class="tabs" aria-label="表示切替" role="tablist">
        <button class="tab is-active" data-view="textbook" type="button" role="tab" aria-selected="true" aria-controls="view-textbook">教本</button>
        <button class="tab" data-view="glossary" type="button" role="tab" aria-selected="false" aria-controls="view-glossary">用語集</button>
      </nav>

      <!-- ===== 教本ビュー ===== -->
      <section id="view-textbook" class="view is-active" aria-label="教本">
        <!-- 章一覧 -->
        <div id="chapter-list-pane">
          <div class="search-band">
            <input
              id="search"
              type="search"
              inputmode="search"
              placeholder="章・キーワードで検索（例: ジュニパー、マティーニ、ネイビー）"
              aria-label="教本内を検索"
            />
            <div id="chapter-filters" class="chapter-filters" aria-label="章の絞り込み">
              <button type="button" class="filter-chip is-active" data-filter="all">すべて</button>
              <button type="button" class="filter-chip" data-filter="unread">未読</button>
              <button type="button" class="filter-chip" data-filter="read">読了</button>
              <button type="button" class="filter-chip" data-filter="memorized">覚えた</button>
              <button type="button" class="filter-chip" data-filter="favorite">★ お気に入り</button>
            </div>
            <p id="search-status" class="search-status"></p>
          </div>
          <div id="chapter-grid" class="chapter-grid"></div>
        </div>

        <!-- 章リーダー -->
        <article id="reader" class="reader" hidden>
          <div class="reader-bar">
            <button id="reader-back" class="link-btn" type="button">← 章一覧へ</button>
            <div class="reader-actions">
              <button id="reader-fav" class="mark-toggle" type="button" aria-pressed="false" title="お気に入りに追加">★ お気に入り</button>
              <button id="reader-memo" class="mark-toggle" type="button" aria-pressed="false" title="覚えたに追加">覚えた</button>
              <button id="reader-read" class="read-toggle" type="button">読了にする</button>
            </div>
          </div>
          <div id="reader-toc" class="reader-toc"></div>
          <div id="reader-body" class="reader-body"></div>
          <div id="reader-nav" class="reader-nav"></div>
        </article>
      </section>

      <!-- ===== 用語集ビュー ===== -->
      <section id="view-glossary" class="view" aria-label="用語集" hidden>
        <div class="search-band">
          <input
            id="glossary-search"
            type="search"
            inputmode="search"
            placeholder="用語を検索（例: フィクサティブ、ステア、ネイビー）"
            aria-label="用語集を検索"
          />
          <div id="glossary-cats" class="glossary-cats"></div>
        </div>
        <div id="glossary-body" class="glossary-body"></div>
      </section>

      <footer class="app-footer">
        <span>Bar Soutsu ジン教本</span>
        <span>社内教育用 / 数値・銘柄情報は要ファクトチェック（次回更新で精査）</span>
      </footer>
    </main>

    <!-- 本文用語のインライン辞書ツールチップ（JSで内容を差し込む） -->
    <div id="term-tip" class="term-tip" hidden role="dialog" aria-label="用語の説明"></div>

    <script src="content.js"></script>
    <script src="glossary.js"></script>
    <script src="app.js"></script>
  </body>
</html>
