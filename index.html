<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <title>Bar Soutsu ジン教本</title>

    <!-- SNS・チャットでURLを共有したときの見栄え（OGP / Twitter Card） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bar Soutsu" />
    <meta property="og:title" content="ジン教本｜Bar Soutsu" />
    <meta property="og:description" content="スタッフ教育用のジン教本。基礎知識・用語集・クイズ・早見表で体系的に学べます。" />
    <meta property="og:url" content="https://sousuyou.github.io/gin-textbook/" />
    <meta property="og:image" content="https://sousuyou.github.io/gin-textbook/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sousuyou.github.io/gin-textbook/assets/og-image.png" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="has-nav">
    <!-- 共通ナビ：中身は nav.js が自動生成（JS無効時はTOPリンクだけ残る） -->
    <nav class="site-nav" id="site-nav">
      <a class="site-nav-link" href="https://sousuyou.github.io/top/">TOP</a>
    </nav>
    <script src="https://sousuyou.github.io/top/nav.js" defer></script>
    <main class="app-shell">
      <!-- ===== ヘッダー ===== -->
      <header class="hero">
        <div class="hero-main">
          <p class="brand-mark">Bar Soutsu</p>
          <p class="eyebrow">Gin Textbook / Staff Training</p>
          <h1 id="page-title">ジン教本</h1>
          <p class="lead">
            ジンを「定義・歴史・製法・銘柄・接客」まで体系で学ぶ、Bar Soutsu スタッフ向けの教本。
            読み物として読み込み、わからない用語は用語集タブで引く。
            実力チェックは<a href="quiz/">クイズ道場</a>、現場での確認は<a href="cheatsheet/">早見表</a>へ。
          </p>
        </div>
      </header>

      <!-- ===== ビュー切替タブ ===== -->
      <nav class="tabs" aria-label="表示切替">
        <button class="tab is-active" data-view="textbook" type="button">教本</button>
        <button class="tab" data-view="glossary" type="button">用語集</button>
      </nav>

      <!-- ===== 教本ビュー ===== -->
      <section id="view-textbook" class="view is-active" aria-label="教本">
        <!-- 章一覧 -->
        <div id="chapter-list-pane">
          <div class="search-band">
            <input
              id="search"
              type="search"
              inputmode="search"
              placeholder="章・キーワードで検索（例: ジュニパー、マティーニ、ネイビー）"
              aria-label="教本内を検索"
            />
            <p id="search-status" class="search-status"></p>
          </div>
          <div id="chapter-grid" class="chapter-grid"></div>
        </div>

        <!-- 章リーダー -->
        <article id="reader" class="reader" hidden>
          <div class="reader-bar">
            <button id="reader-back" class="link-btn" type="button">← 章一覧へ</button>
            <button id="reader-read" class="read-toggle" type="button">読了にする</button>
          </div>
          <div id="reader-toc" class="reader-toc"></div>
          <div id="reader-body" class="reader-body"></div>
          <div id="reader-nav" class="reader-nav"></div>
        </article>
      </section>

      <!-- ===== 用語集ビュー ===== -->
      <section id="view-glossary" class="view" aria-label="用語集" hidden>
        <div class="search-band">
          <input
            id="glossary-search"
            type="search"
            inputmode="search"
            placeholder="用語を検索（例: フィクサティブ、ステア、ネイビー）"
            aria-label="用語集を検索"
          />
          <div id="glossary-cats" class="glossary-cats"></div>
        </div>
        <div id="glossary-body" class="glossary-body"></div>
      </section>

      <footer class="app-footer">
        <span>Bar Soutsu ジン教本</span>
        <span>社内教育用 / 数値・銘柄情報は要ファクトチェック（次回更新で精査）</span>
      </footer>
    </main>

    <script src="content.js"></script>
    <script src="glossary.js"></script>
    <script src="app.js"></script>
  </body>
</html>
